services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shiftly
      POSTGRES_USER: shiftly
      POSTGRES_PASSWORD: shiftly
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiftly"]
      interval: 3s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  php:
    build:
      context: ./shiftly-api
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./shiftly-api:/var/www/api
    working_dir: /var/www/api
    environment:
      DATABASE_URL: postgresql://shiftly:shiftly@db:5432/shiftly?serverVersion=16&charset=utf8

volumes:
  db_data:
