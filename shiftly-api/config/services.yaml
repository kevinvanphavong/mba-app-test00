# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Hash bcrypt de "bowling123" (cost 12) — utilisé dans les fixtures
    fixture_password_hash: '$2y$12$6Cg1WMC8d0t5GWoKq4fBZOzb1f.5GXXjMd3WQq7Sk5Y7I7UfEg7da'

    # Part d'acompte exigée à la réservation B2C (0.20 = 20%). Paramétrable.
    app.reservation.acompte_rate: 0.20

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            $projectDir: '%kernel.project_dir%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    App\Service\SentryApiService:
        arguments:
            $sentryAuthToken: '%env(SENTRY_AUTH_TOKEN)%'
            $sentryOrg:       '%env(SENTRY_ORG)%'
            $sentryProject:   '%env(SENTRY_PROJECT)%'

    App\Service\R2StorageService:
        arguments:
            $accountId:       '%env(R2_ACCOUNT_ID)%'
            $accessKeyId:     '%env(R2_ACCESS_KEY_ID)%'
            $secretAccessKey: '%env(R2_SECRET_ACCESS_KEY)%'
            $bucket:          '%env(R2_BUCKET)%'
            $endpoint:        '%env(R2_ENDPOINT)%'

    App\Service\Mail\LeadNotifier:
        arguments:
            $notificationEmail: '%env(LEAD_NOTIFICATION_EMAIL)%'
            $appBaseUrl:        '%env(APP_BASE_URL)%'

    # TTL du cookie JWT aligné sur le token_ttl lexik (8h).
    App\Security\AuthCookieFactory:
        arguments:
            $tokenTtl: 28800

    # Rate limiter anti-flood de la capture de leads (cf. rate_limiter.yaml).
    App\Controller\LeadController:
        arguments:
            $leadCreationLimiter: '@limiter.lead_creation'

    # Taux d'acompte des réservations B2C (paramétrable, défaut 20%).
    App\Service\ReservationCreator:
        arguments:
            $acompteRate: '%app.reservation.acompte_rate%'

    # ─── Core IA — porte d'entrée unique + quota par centre ───────────────────
    # Tout usage IA passe par l'interface (jamais AiService en direct).
    App\Core\Ia\IaGeneratorInterface: '@App\Core\Ia\IaGenerator'

    App\Core\Ia\IaGenerator:
        arguments:
            # Plafond DUR d'appels IA par centre et par mois (coupe-circuit coût).
            $plafondMensuel: '%env(int:IA_PLAFOND_MENSUEL_CENTRE)%'
            # Budget IA distinct de la plateforme (super-admin / console agence).
            $plafondPlateforme: '%env(int:IA_PLAFOND_MENSUEL_PLATEFORME)%'

    # ─── Stripe — paiement de l'acompte ──────────────────────────────────────
    # Seam testable : le gateway Stripe réel implémente l'interface ; les tests
    # l'aliasent vers un faux (aucun appel réseau).
    App\Service\Stripe\CheckoutGatewayInterface: '@App\Service\Stripe\StripeCheckoutGateway'

    App\Service\Stripe\StripeCheckoutGateway:
        arguments:
            $stripeSecretKey: '%env(STRIPE_SECRET_KEY)%'

    App\Service\ReservationPaymentService:
        arguments:
            $publicSiteBaseUrl: '%env(PUBLIC_SITE_BASE_URL)%'

    App\Controller\Web\StripeWebhookController:
        arguments:
            $stripeWebhookSecret: '%env(STRIPE_WEBHOOK_SECRET)%'

    # ─── Stripe — abonnements récurrents (compte AGENCE), distinct de l'acompte ───
    App\Service\PlanAssignmentService:
        arguments:
            $publicSiteBaseUrl: '%env(PUBLIC_SITE_BASE_URL)%'

    App\Service\Stripe\SubscriptionGatewayInterface: '@App\Service\Stripe\StripeSubscriptionGateway'

    App\Service\Stripe\StripeSubscriptionGateway:
        arguments:
            $stripeSecretKey: '%env(STRIPE_SECRET_KEY)%'

    App\Controller\Web\StripeSubscriptionWebhookController:
        arguments:
            $stripeWebhookSecret: '%env(STRIPE_SUBSCRIPTION_WEBHOOK_SECRET)%'

    App\MessageHandler\ReservationConfirmeeHandler:
        arguments:
            $fromEmail: '%env(LEAD_NOTIFICATION_EMAIL)%'

    # ─── CRM — relances no-show + collecte d'avis (emails via Messenger) ──────
    App\MessageHandler\DemandeAvisHandler:
        arguments:
            $fromEmail: '%env(LEAD_NOTIFICATION_EMAIL)%'
            $publicSiteBaseUrl: '%env(PUBLIC_SITE_BASE_URL)%'

    App\Controller\RelanceController:
        arguments:
            $fromEmail: '%env(LEAD_NOTIFICATION_EMAIL)%'

    # Rate limiter anti brute-force login (cf. rate_limiter.yaml).
    App\EventSubscriber\LoginRateLimitSubscriber:
        arguments:
            $authLoginLimiter: '@limiter.auth_login'

    # Rate limiter anti-abus des écritures publiques (cf. rate_limiter.yaml).
    App\EventSubscriber\PublicRateLimitSubscriber:
        arguments:
            $publicWriteLimiter: '@limiter.public_write'

    # Rate limiter anti-abus de l'ingestion machine-to-machine (cf. rate_limiter.yaml).
    App\EventSubscriber\IngestRateLimitSubscriber:
        arguments:
            $ingestLimiter: '@limiter.ingest'

    # Le JWT est lu dans un cookie httpOnly (path-aware) : on décore la chaîne
    # d'extracteurs lexik. Anti-XSS : plus aucun token manipulé par le JS.
    App\Security\PathAwareCookieTokenExtractor:
        decorates: lexik_jwt_authentication.extractor.chain_extractor
        arguments:
            $inner: '@.inner'

when@test:
    services:
        # En test : on remplace le gateway Stripe réel par un faux (aucun réseau).
        App\Tests\Fake\FakeCheckoutGateway:
            public: true
        App\Service\Stripe\CheckoutGatewayInterface: '@App\Tests\Fake\FakeCheckoutGateway'
        # Faux gateway d'abonnement (aucun appel Stripe Billing en test).
        App\Tests\Fake\FakeSubscriptionGateway:
            public: true
        App\Service\Stripe\SubscriptionGatewayInterface: '@App\Tests\Fake\FakeSubscriptionGateway'
        # IA déterministe en test (aucun appel Mistral) pour la génération de devis.
        App\Tests\Fake\FakeIaGenerator:
            public: true
        App\Core\Ia\IaGeneratorInterface: '@App\Tests\Fake\FakeIaGenerator'
