lexik_jwt_authentication:
    secret_key: '%env(resolve:JWT_SECRET_KEY)%'
    public_key: '%env(resolve:JWT_PUBLIC_KEY)%'
    pass_phrase: '%env(JWT_PASSPHRASE)%'
    token_ttl: 28800  # 8 heures

    # Le JWT n'est lu QUE dans un cookie httpOnly (cf. PathAwareCookieTokenExtractor
    # qui décore la chaîne). On désactive l'extractor header : le JS ne touche
    # plus au token (anti-XSS), aucun en-tête Authorization côté front.
    token_extractors:
        authorization_header:
            enabled: false
