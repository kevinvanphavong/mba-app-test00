security:
    password_hashers:
        App\Entity\User:
            algorithm: bcrypt

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # Zone publique de la Branche 1 (site client résolu par domaine, lecture
        # seule). Strictement bornée à ^/api/public : aucun authenticator n'y tourne
        # et aucune autre route n'est ouverte. Le reste de l'API garde son firewall.
        public_web:
            pattern: ^/api/public
            stateless: true
            security: false

        superadmin_login:
            pattern: ^/api/superadmin/auth/login
            stateless: true
            json_login:
                check_path: /api/superadmin/auth/login
                username_path: email
                password_path: password
                success_handler: App\Security\CookieAuthenticationSuccessHandler
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        superadmin_api:
            pattern: ^/api/superadmin
            stateless: true
            jwt: ~

        login:
            pattern: ^/api/auth/login
            stateless: true
            # Fail-closed : refuse le login d'un gérant dont le centre est suspendu.
            user_checker: App\Security\CentreActifUserChecker
            json_login:
                check_path: /api/auth/login
                username_path: email
                password_path: password
                success_handler: App\Security\CookieAuthenticationSuccessHandler
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api:
            pattern: ^/api
            stateless: true
            # Fail-closed : chaque requête JWT d'un gérant est refusée si le centre est suspendu.
            user_checker: App\Security\CentreActifUserChecker
            jwt: ~

    access_control:
        - { path: ^/api/superadmin/auth/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/superadmin, roles: ROLE_SUPERADMIN }
        - { path: ^/api/auth/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/logout, roles: PUBLIC_ACCESS, methods: [POST] }
        # Endpoint public de capture des leads (landing shiftly.fr)
        - { path: ^/api/leads$, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/docs, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
