# Un seul service écrit à la main : celui du jour (postes, complétions et
# incident de démo). Les autres jours sont générés par `app:demo:seed` à partir
# des horaires d'ouverture réels du centre — pas de dérive jour/date.
App\Entity\Service:
  svc_eb_today:
    centre: "@centre_espace_bourges"
    date: "<(new \\DateTimeImmutable('today'))>"
    heureDebut: "<(new \\DateTimeImmutable('17:00:00'))>"
    heureFin: "<(new \\DateTimeImmutable('00:00:00'))>"
    statut: "EN_COURS"
    tauxCompletion: 0.0
    note: "EVJF de 12 personnes à 20h — BattleKart puis karaoké box 2, planches à prévoir au bar."

