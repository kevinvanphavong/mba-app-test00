App\Entity\Tutoriel:
  tuto_eb_brief_arene:
    centre:  "@centre_espace_bourges"
    titre:   "Briefing sécurité BattleKart et lasergame"
    zone:    "@zone_eb_arenes"
    niveau:  "debutant"
    dureMin: 15
    contenu:
      - { type: "intro", text: "Un joueur mal briefé est un danger pour lui et pour les autres. Le brief est obligatoire, même pour les habitués." }
      - { type: "step", number: 1, title: "Avant d'entrer en arène", text: "Retirer lunettes non attachées, écharpes et objets dans les poches. Chaussures fermées obligatoires." }
      - { type: "step", number: 2, title: "Règles de jeu", text: "Aucun contact physique. Interdiction de courir en lasergame, de percuter volontairement en BattleKart." }
      - { type: "step", number: 3, title: "En cas de souci", text: "Lever la main, rester à sa place, attendre l'animateur. Ne jamais descendre du kart en cours de partie." }
      - { type: "tip", text: "Groupes d'anniversaires d'ados : insister 3× sur l'interdiction de contact — c'est le plus risqué." }
  tuto_eb_pistes:
    centre:  "@centre_espace_bourges"
    titre:   "Ouverture et entretien des pistes de bowling"
    zone:    "@zone_eb_bowling"
    niveau:  "avance"
    dureMin: 25
    contenu:
      - { type: "intro", text: "Une piste mal préparée fausse le jeu et abîme les boules. Cette routine se fait chaque matin avant ouverture." }
      - { type: "step", number: 1, title: "Huilage", text: "Passer la machine d'huilage sur les 12 pistes, motif standard. Vérifier le niveau d'huile avant le premier passage." }
      - { type: "step", number: 2, title: "Machines de remise en jeu", text: "Lancer un cycle à vide par piste. Toute quille mal repositionnée = piste hors service et fiche technique." }
      - { type: "step", number: 3, title: "Boules et chaussures", text: "Retirer les boules fissurées. Contrôler que chaque pointure est disponible et désinfectée." }
      - { type: "tip", text: "Anomalie mécanique : piste hors service + fiche rouge + info immédiate au manager. Jamais de bricolage en cours de service." }
  tuto_eb_vr:
    centre:  "@centre_espace_bourges"
    titre:   "Hygiène et mise en main des casques VR"
    zone:    "@zone_eb_immersif"
    niveau:  "debutant"
    dureMin: 10
    contenu:
      - { type: "intro", text: "Le casque VR est en contact direct avec le visage : l'hygiène n'est pas négociable entre deux joueurs." }
      - { type: "step", number: 1, title: "Avant la session", text: "Mousse propre ou jetable posée, sangles réglées, batterie au-dessus de 50 %." }
      - { type: "step", number: 2, title: "Mise en main", text: "Expliquer la zone de jeu et les limites, remettre les manettes dragonnes attachées." }
      - { type: "step", number: 3, title: "Après la session", text: "Désinfecter mousse et manettes, remettre le casque en charge dans son rack." }
      - { type: "tip", text: "Joueur qui a le mal des transports : proposer une expérience assise et rester à côté de lui." }

