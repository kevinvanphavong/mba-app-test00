App\Entity\Mission:
  # ─── Accueil & Caisse ──────────────────────────────────────────────────────
  m_eb_acc_ouv_1:  { zone: "@zone_eb_accueil", texte: "Ouvrir la caisse : fond de 200 €, TPE et bornes de réservation opérationnels", categorie: "Ouverture", frequence: "FIXE", priorite: "vitale", ordre: 1 }
  m_eb_acc_ouv_2:  { zone: "@zone_eb_accueil", texte: "Éditer le planning des réservations du jour (anniversaires, EVG/EVJF, CSE, séminaires)", categorie: "Ouverture", frequence: "FIXE", priorite: "vitale", ordre: 2 }
  m_eb_acc_ouv_3:  { zone: "@zone_eb_accueil", texte: "Contrôler le stock de chaussures de bowling par pointure et le spray désinfectant", categorie: "Ouverture", frequence: "FIXE", priorite: "important", ordre: 3 }
  m_eb_acc_pend_1: { zone: "@zone_eb_accueil", texte: "Accueillir, encaisser et attribuer les pistes et créneaux d'activité", categorie: "Pendant", frequence: "FIXE", priorite: "vitale", ordre: 1 }
  m_eb_acc_pend_2: { zone: "@zone_eb_accueil", texte: "Remettre et désinfecter les chaussures de bowling à chaque retour", categorie: "Pendant", frequence: "FIXE", priorite: "vitale", ordre: 2 }
  m_eb_acc_pend_3: { zone: "@zone_eb_accueil", texte: "Gérer cartes cadeaux, packages et arrivées de groupes", categorie: "Pendant", frequence: "FIXE", priorite: "important", ordre: 3 }
  m_eb_acc_men_1:  { zone: "@zone_eb_accueil", texte: "Désinfecter banque d'accueil, TPE et bornes tactiles", categorie: "Ménage", frequence: "FIXE", priorite: "important", ordre: 1 }
  m_eb_acc_ferm_1: { zone: "@zone_eb_accueil", texte: "Clôture de caisse, comptage et remise du fond au coffre", categorie: "Fermeture", frequence: "FIXE", priorite: "vitale", ordre: 1 }
  m_eb_acc_ferm_2: { zone: "@zone_eb_accueil", texte: "Ranger les chaussures par pointure sur les racks désinfectants", categorie: "Fermeture", frequence: "FIXE", priorite: "important", ordre: 2 }

  # ─── Bowling ───────────────────────────────────────────────────────────────
  m_eb_bow_ouv_1:  { zone: "@zone_eb_bowling", texte: "Mise en route des pistes : machines de remise en jeu, écrans de score, éclairage", categorie: "Ouverture", frequence: "FIXE", priorite: "vitale", ordre: 1 }
  m_eb_bow_ouv_2:  { zone: "@zone_eb_bowling", texte: "Huilage des pistes et contrôle des gouttières et rails", categorie: "Ouverture", frequence: "FIXE", priorite: "vitale", ordre: 2 }
  m_eb_bow_ouv_3:  { zone: "@zone_eb_bowling", texte: "Vérifier les boules par poids et retirer celles fissurées ou ébréchées", categorie: "Ouverture", frequence: "FIXE", priorite: "important", ordre: 3 }
  m_eb_bow_pend_1: { zone: "@zone_eb_bowling", texte: "Attribuer les pistes, lancer les parties et saisir les noms des joueurs", categorie: "Pendant", frequence: "FIXE", priorite: "vitale", ordre: 1 }
  m_eb_bow_pend_2: { zone: "@zone_eb_bowling", texte: "Débloquer les quilles coincées et relancer la machine concernée", categorie: "Pendant", frequence: "FIXE", priorite: "vitale", ordre: 2 }
  m_eb_bow_pend_3: { zone: "@zone_eb_bowling", texte: "Installer les barrières anti-gouttière pour les groupes enfants", categorie: "Pendant", frequence: "FIXE", priorite: "important", ordre: 3 }
  m_eb_bow_men_1:  { zone: "@zone_eb_bowling", texte: "Balayer les approches et nettoyer les retours de boules", categorie: "Ménage", frequence: "FIXE", priorite: "important", ordre: 1 }
  m_eb_bow_ferm_1: { zone: "@zone_eb_bowling", texte: "Arrêter les machines de remise en jeu et couper écrans et projecteurs", categorie: "Fermeture", frequence: "FIXE", priorite: "vitale", ordre: 1 }
  m_eb_bow_ferm_2: { zone: "@zone_eb_bowling", texte: "Contrôle mécanique des quilles et report des anomalies au cahier technique", categorie: "Fermeture", frequence: "FIXE", priorite: "important", ordre: 2 }

  # ─── BattleKart & Lasergame ────────────────────────────────────────────────
  m_eb_are_ouv_1:  { zone: "@zone_eb_arenes", texte: "Charger et tester les gilets lasergame (batterie, capteurs, gâchette)", categorie: "Ouverture", frequence: "FIXE", priorite: "vitale", ordre: 1 }
  m_eb_are_ouv_2:  { zone: "@zone_eb_arenes", texte: "Contrôler les karts BattleKart : batteries, freins, ceintures", categorie: "Ouverture", frequence: "FIXE", priorite: "vitale", ordre: 2 }
  m_eb_are_ouv_3:  { zone: "@zone_eb_arenes", texte: "Calibrer la projection au sol BattleKart et lancer une partie à blanc", categorie: "Ouverture", frequence: "FIXE", priorite: "vitale", ordre: 3 }
  m_eb_are_pend_1: { zone: "@zone_eb_arenes", texte: "Briefing sécurité obligatoire avant chaque partie (règles, contacts interdits)", categorie: "Pendant", frequence: "FIXE", priorite: "vitale", ordre: 1 }
  m_eb_are_pend_2: { zone: "@zone_eb_arenes", texte: "Surveiller la partie depuis le poste de contrôle et intervenir en cas d'incident", categorie: "Pendant", frequence: "FIXE", priorite: "vitale", ordre: 2 }
  m_eb_are_pend_3: { zone: "@zone_eb_arenes", texte: "Imprimer et commenter les scores en fin de session", categorie: "Pendant", frequence: "FIXE", priorite: "important", ordre: 3 }
  m_eb_are_men_1:  { zone: "@zone_eb_arenes", texte: "Désinfecter gilets, casques et sièges des karts entre chaque groupe", categorie: "Ménage", frequence: "FIXE", priorite: "vitale", ordre: 1 }
  m_eb_are_ferm_1: { zone: "@zone_eb_arenes", texte: "Remettre tous les gilets en charge et brancher les karts", categorie: "Fermeture", frequence: "FIXE", priorite: "vitale", ordre: 1 }
  m_eb_are_ferm_2: { zone: "@zone_eb_arenes", texte: "Éteindre vidéoprojecteurs, machine à fumée et sono d'arène", categorie: "Fermeture", frequence: "FIXE", priorite: "important", ordre: 2 }

  # ─── VR · Karaoké · Arcades ────────────────────────────────────────────────
  m_eb_imm_ouv_1:  { zone: "@zone_eb_immersif", texte: "Démarrer les casques VR : niveau de charge et mise à jour des expériences", categorie: "Ouverture", frequence: "FIXE", priorite: "vitale", ordre: 1 }
  m_eb_imm_ouv_2:  { zone: "@zone_eb_immersif", texte: "Tester micros, sono et écrans des karaoké box", categorie: "Ouverture", frequence: "FIXE", priorite: "vitale", ordre: 2 }
  m_eb_imm_ouv_3:  { zone: "@zone_eb_immersif", texte: "Faire l'appoint des jetons et contrôler bornes arcade, billards et mini-golf", categorie: "Ouverture", frequence: "FIXE", priorite: "important", ordre: 3 }
  m_eb_imm_pend_1: { zone: "@zone_eb_immersif", texte: "Équiper et briefer les joueurs VR, surveiller la zone de jeu", categorie: "Pendant", frequence: "FIXE", priorite: "vitale", ordre: 1 }
  m_eb_imm_pend_2: { zone: "@zone_eb_immersif", texte: "Installer les groupes en karaoké box et lancer les playlists", categorie: "Pendant", frequence: "FIXE", priorite: "important", ordre: 2 }
  m_eb_imm_pend_3: { zone: "@zone_eb_immersif", texte: "Réarmer les billards et débloquer les bornes arcade", categorie: "Pendant", frequence: "FIXE", priorite: "ne_pas_oublier", ordre: 3 }
  m_eb_imm_men_1:  { zone: "@zone_eb_immersif", texte: "Nettoyer les mousses de casques VR et les micros après chaque session", categorie: "Ménage", frequence: "FIXE", priorite: "vitale", ordre: 1 }
  m_eb_imm_ferm_1: { zone: "@zone_eb_immersif", texte: "Remettre casques et manettes VR en charge dans les racks", categorie: "Fermeture", frequence: "FIXE", priorite: "vitale", ordre: 1 }
  m_eb_imm_ferm_2: { zone: "@zone_eb_immersif", texte: "Éteindre bornes arcade, éclairage billards et écrans karaoké", categorie: "Fermeture", frequence: "FIXE", priorite: "important", ordre: 2 }

  # ─── Bar & Restauration ────────────────────────────────────────────────────
  m_eb_bar_ouv_1:  { zone: "@zone_eb_bar", texte: "Mise en route cuisine (four à pizza, friteuse) et mise en place snacking", categorie: "Ouverture", frequence: "FIXE", priorite: "vitale", ordre: 1 }
  m_eb_bar_ouv_2:  { zone: "@zone_eb_bar", texte: "Relever les températures des frigos et de la chambre froide (HACCP)", categorie: "Ouverture", frequence: "FIXE", priorite: "vitale", ordre: 2 }
  m_eb_bar_ouv_3:  { zone: "@zone_eb_bar", texte: "Vérifier stocks boissons et fûts, mise en place terrasse et guinguette", categorie: "Ouverture", frequence: "FIXE", priorite: "important", ordre: 3 }
  m_eb_bar_pend_1: { zone: "@zone_eb_bar", texte: "Service bar et restauration : pizzas, planches à partager, cocktails", categorie: "Pendant", frequence: "FIXE", priorite: "vitale", ordre: 1 }
  m_eb_bar_pend_2: { zone: "@zone_eb_bar", texte: "Gérer les formules anniversaires et les buffets séminaires / CSE", categorie: "Pendant", frequence: "FIXE", priorite: "important", ordre: 2 }
  m_eb_bar_men_1:  { zone: "@zone_eb_bar", texte: "Nettoyer plonge, plancha et surfaces de préparation en cours de service", categorie: "Ménage", frequence: "FIXE", priorite: "important", ordre: 1 }
  m_eb_bar_ferm_1: { zone: "@zone_eb_bar", texte: "Nettoyage cuisine, rangement chambre froide et clôture caisse bar", categorie: "Fermeture", frequence: "FIXE", priorite: "vitale", ordre: 1 }
  m_eb_bar_ferm_2: { zone: "@zone_eb_bar", texte: "Rentrer le mobilier de terrasse et fermer la guinguette", categorie: "Fermeture", frequence: "FIXE", priorite: "important", ordre: 2 }

