App\Entity\Centre:
  centre_espace_bourges:
    nom:       "Espace Bourges"
    adresse:   "Le Briou, Route d'Orléans, 18230 Saint-Doulchard"
    telephone: "02 48 16 31 12"
    siteWeb:   "https://espace-bourges.fr"
    siteHeroTitre:     "Espace Bourges"
    siteHeroSousTitre: "Le plus grand complexe de loisirs du Cher"
    siteDescription:   >-
      4500 m² dédiés au jeu à Saint-Doulchard, aux portes de Bourges : bowling,
      BattleKart, lasergame, réalité virtuelle, karaoké box, mini-golf, billards
      et arcades. Sur place, un espace bar & restauration (pizzas, planches à
      partager, cocktails), une terrasse et sa guinguette. Anniversaires, EVG/EVJF,
      séminaires, team building, CSE et privatisations.
    openingHours:
      lundi:    { ouvert: false, ouverture: "17:00", fermeture: "00:00" }
      mardi:    { ouvert: true,  ouverture: "17:00", fermeture: "00:00" }
      mercredi: { ouvert: true,  ouverture: "17:00", fermeture: "00:00" }
      jeudi:    { ouvert: true,  ouverture: "17:00", fermeture: "00:00" }
      vendredi: { ouvert: true,  ouverture: "17:00", fermeture: "01:00" }
      samedi:   { ouvert: true,  ouverture: "10:00", fermeture: "01:00" }
      dimanche: { ouvert: true,  ouverture: "14:00", fermeture: "19:00" }

