# ─── Compétences (20 = 4 zones × 5) ──────────────────────────────────────────
App\Entity\Competence:

  # Accueil
  comp_acc_1: { zone: "@zone_accueil", nom: "Caisse & encaissement",       points: 10, difficulte: "simple",      description: "Utiliser la caisse, encaisser CB/espèces, faire un rapport Z." }
  comp_acc_2: { zone: "@zone_accueil", nom: "Réservations téléphone/web",  points: 10, difficulte: "simple",      description: "Prendre une résa, vérifier dispo, confirmer au client." }
  comp_acc_3: { zone: "@zone_accueil", nom: "Cartes fidélité & promos",    points: 10, difficulte: "simple",      description: "Créer une carte fidélité, appliquer une promo, gérer un code." }
  comp_acc_4: { zone: "@zone_accueil", nom: "Anniversaires & events",      points: 15, difficulte: "avancee",     description: "Coordonner un anniversaire enfant ou un event groupe." }
  comp_acc_5: { zone: "@zone_accueil", nom: "Litige client de comptoir",   points: 20, difficulte: "experimente", description: "Désamorcer une réclamation, faire un remboursement." }

  # Bar
  comp_bar_1: { zone: "@zone_bar", nom: "Tirage pression",            points: 10, difficulte: "simple",      description: "Tirer une bière correctement, mousse, propreté du verre." }
  comp_bar_2: { zone: "@zone_bar", nom: "Cocktails & boissons sucrées", points: 15, difficulte: "avancee",  description: "Préparer cocktails maison et boissons à thème." }
  comp_bar_3: { zone: "@zone_bar", nom: "Caisse bar",                 points: 10, difficulte: "simple",      description: "Encaisser au bar, ouvrir/fermer la caisse bar." }
  comp_bar_4: { zone: "@zone_bar", nom: "HACCP & relevés température", points: 15, difficulte: "avancee",   description: "Faire le relevé HACCP, gérer les DLC et la chaîne du froid." }
  comp_bar_5: { zone: "@zone_bar", nom: "Inventaire bar",             points: 20, difficulte: "experimente", description: "Inventaire complet (boissons, snacks, consommables)." }

  # Salle
  comp_sal_1: { zone: "@zone_salle", nom: "Service piste bowling",      points: 10, difficulte: "simple",      description: "Lancer une partie, gérer le score, dépanner une piste." }
  comp_sal_2: { zone: "@zone_salle", nom: "Service laser game",         points: 15, difficulte: "avancee",     description: "Briefer les équipes, lancer une partie laser, debug arène." }
  comp_sal_3: { zone: "@zone_salle", nom: "Service VR",                 points: 15, difficulte: "avancee",     description: "Casquer, lancer et superviser une session VR." }
  comp_sal_4: { zone: "@zone_salle", nom: "Mise en place salle",        points: 10, difficulte: "simple",      description: "Préparer tables, tabourets, signalétique avant ouverture." }
  comp_sal_5: { zone: "@zone_salle", nom: "Désinfection équipements",   points: 10, difficulte: "simple",      description: "Désinfecter chaussures bowling, casques VR, gilets laser." }

  # Manager
  comp_mgr_1: { zone: "@zone_manager", nom: "Clôture caisse globale",    points: 25, difficulte: "experimente", description: "Clôturer la journée, faire la dépose banque, scellés." }
  comp_mgr_2: { zone: "@zone_manager", nom: "Planning & validation heures", points: 25, difficulte: "experimente", description: "Construire un planning, valider les heures pointées." }
  comp_mgr_3: { zone: "@zone_manager", nom: "Gestion d'incidents",       points: 20, difficulte: "avancee",     description: "Prendre en charge un incident client ou matériel critique." }
  comp_mgr_4: { zone: "@zone_manager", nom: "Brief équipe",              points: 15, difficulte: "avancee",     description: "Faire un brief équipe clair en début de service." }
  comp_mgr_5: { zone: "@zone_manager", nom: "Audit HACCP",               points: 20, difficulte: "avancee",     description: "Auditer la conformité HACCP : relevés, plan nettoyage, DLC." }

