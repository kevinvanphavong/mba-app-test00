# ─── Centre ──────────────────────────────────────────────────────────────────
App\Entity\Centre:
  centre_fgc:
    nom:             "Family Games Center"
    adresse:         "25 rue Robert Nau, 41000 Blois"
    tenueHaut:       "Polo Shiftly noir"
    tenueBas:        "Pantalon noir"
    tenueChaussures: "Chaussures noires fermées"
    openingHours:
      lundi:    { ouvert: true,  ouverture: "17:00", fermeture: "23:00" }
