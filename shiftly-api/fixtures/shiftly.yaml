# ─── Tutoriels (20 = 4 zones × 5) ────────────────────────────────────────────
App\Entity\Tutoriel:

  # Accueil
  tuto_acc_1:
    centre: "@centre_fgc"
    zone:   "@zone_accueil"
    titre:  "Faire l'ouverture de la caisse"
    niveau: "debutant"
    dureMin: 5
    contenu: [{ type: "text", value: "Allume l'ordinateur, lance le logiciel de caisse, saisis le fond de caisse remis le matin." }]
  tuto_acc_2:
    centre: "@centre_fgc"
    zone:   "@zone_accueil"
    titre:  "Encaisser une vente (CB, espèces)"
    niveau: "debutant"
    dureMin: 7
    contenu: [{ type: "text", value: "Scanne le bracelet, ajoute les options, choisis CB ou espèces, imprime le ticket." }]
  tuto_acc_3:
    centre: "@centre_fgc"
    zone:   "@zone_accueil"
    titre:  "Prendre une réservation par téléphone"
    niveau: "debutant"
    dureMin: 6
    contenu: [{ type: "text", value: "Demande nombre de personnes, créneau, activités souhaitées. Confirme par mail/SMS." }]
  tuto_acc_4:
    centre: "@centre_fgc"
    zone:   "@zone_accueil"
    titre:  "Organiser un anniversaire enfant"
    niveau: "intermediaire"
    dureMin: 12
    contenu: [{ type: "text", value: "Formule, nombre d'enfants, gâteau, déco, créneau bowling/laser. Coordonne avec la salle." }]
  tuto_acc_5:
    centre: "@centre_fgc"
    zone:   "@zone_accueil"
    titre:  "Clôturer la caisse en fin de service"
    niveau: "intermediaire"
    dureMin: 10
    contenu: [{ type: "text", value: "Rapport Z, compte le fond de caisse, met la dépose en coffre, scelle l'enveloppe." }]

  # Bar
  tuto_bar_1:
    centre: "@centre_fgc"
    zone:   "@zone_bar"
    titre:  "Tirer une pression correctement"
    niveau: "debutant"
    dureMin: 6
    contenu: [{ type: "text", value: "Verre incliné, tire la pression à 45°, laisse retomber la mousse, sers à la bonne température." }]
  tuto_bar_2:
    centre: "@centre_fgc"
    zone:   "@zone_bar"
    titre:  "Préparer les cocktails de la carte FGC"
    niveau: "intermediaire"
    dureMin: 15
    contenu: [{ type: "text", value: "Mojito, Spritz, Sex on the Beach : dosage et présentation maison." }]
  tuto_bar_3:
    centre: "@centre_fgc"
    zone:   "@zone_bar"
    titre:  "Faire le relevé HACCP des frigos"
    niveau: "intermediaire"
    dureMin: 8
    contenu: [{ type: "text", value: "Relève la T° de chaque frigo, signale toute valeur >3°C ou <-1°C, signe le registre." }]
  tuto_bar_4:
    centre: "@centre_fgc"
    zone:   "@zone_bar"
    titre:  "Nettoyer la tireuse à bière (fin de service)"
    niveau: "debutant"
    dureMin: 7
    contenu: [{ type: "text", value: "Branche le rinceur, fais un cycle eau, démonte le bec, brosse, remonte sec." }]
  tuto_bar_5:
    centre: "@centre_fgc"
    zone:   "@zone_bar"
    titre:  "Faire l'inventaire bar de fin de mois"
    niveau: "avance"
    dureMin: 25
    contenu: [{ type: "text", value: "Compte tous les fûts, bouteilles ouvertes (au cl près), snacks. Saisis dans le tableau partagé." }]

  # Salle
  tuto_sal_1:
    centre: "@centre_fgc"
    zone:   "@zone_salle"
    titre:  "Lancer une partie de bowling"
    niveau: "debutant"
    dureMin: 5
    contenu: [{ type: "text", value: "Saisis le nombre de joueurs, leurs prénoms, lance la partie depuis la console centrale." }]
  tuto_sal_2:
    centre: "@centre_fgc"
    zone:   "@zone_salle"
    titre:  "Briefer une équipe avant une partie laser"
    niveau: "intermediaire"
    dureMin: 8
    contenu: [{ type: "text", value: "Règles, gilets, durée, zones interdites, signal de fin. Mets l'ambiance." }]
  tuto_sal_3:
    centre: "@centre_fgc"
    zone:   "@zone_salle"
    titre:  "Lancer une session VR"
    niveau: "intermediaire"
    dureMin: 10
    contenu: [{ type: "text", value: "Configure les casques, désinfecte, briefe sur le confort, lance le jeu choisi." }]
  tuto_sal_4:
    centre: "@centre_fgc"
    zone:   "@zone_salle"
    titre:  "Désinfecter chaussures et équipements"
    niveau: "debutant"
    dureMin: 4
    contenu: [{ type: "text", value: "Spray désinfectant intérieur chaussures, casques VR essuyés au chiffon microfibre." }]
  tuto_sal_5:
    centre: "@centre_fgc"
    zone:   "@zone_salle"
    titre:  "Débloquer une quille / piste bowling"
    niveau: "intermediaire"
    dureMin: 6
    contenu: [{ type: "text", value: "Identifie le défaut, reset la piste depuis la console, si bloqué appelle un manager." }]

  # Manager
  tuto_mgr_1:
    centre: "@centre_fgc"
    zone:   "@zone_manager"
    titre:  "Faire le brief équipe d'ouverture"
    niveau: "intermediaire"
    dureMin: 8
    contenu: [{ type: "text", value: "Annonce les events de la journée, les réservations chargées, les points d'attention." }]
  tuto_mgr_2:
    centre: "@centre_fgc"
    zone:   "@zone_manager"
    titre:  "Construire un planning hebdomadaire"
    niveau: "avance"
    dureMin: 30
    contenu: [{ type: "text", value: "Démarre depuis un template, ajuste les besoins par zone, respecte les contrats CDI/CDD/EXTRA." }]
  tuto_mgr_3:
    centre: "@centre_fgc"
    zone:   "@zone_manager"
    titre:  "Valider les heures pointées de la semaine"
    niveau: "avance"
    dureMin: 15
    contenu: [{ type: "text", value: "Compare planning prévu vs pointé, valide ou corrige, signe la fiche pour la paie." }]
  tuto_mgr_4:
    centre: "@centre_fgc"
    zone:   "@zone_manager"
    titre:  "Gérer un incident client critique"
    niveau: "avance"
    dureMin: 12
    contenu: [{ type: "text", value: "Écoute, isole, fais un geste commercial proportionné, consigne dans Shiftly." }]
  tuto_mgr_5:
    centre: "@centre_fgc"
    zone:   "@zone_manager"
    titre:  "Clôturer la journée comptable"
    niveau: "avance"
    dureMin: 20
    contenu: [{ type: "text", value: "Cumul caisses accueil + bar, dépose banque, scellés, rapport au siège." }]

