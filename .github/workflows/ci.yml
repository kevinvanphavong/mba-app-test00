name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Symfony + Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shiftly-api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shiftly
          POSTGRES_USER: shiftly
          POSTGRES_PASSWORD: shiftly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shiftly"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://shiftly:shiftly@localhost:5432/shiftly?serverVersion=16&charset=utf8

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, intl, zip
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: shiftly-api/vendor
          key: composer-${{ hashFiles('shiftly-api/composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --prefer-dist

      # Clés JWT (gitignored) : générées avec la passphrase de test (.env.test).
      - name: Générer les clés JWT
        run: php bin/console lexik:jwt:generate-keypair --overwrite --no-interaction --env=test

      # Conteneur dev compilé : nécessaire au containerXmlPath de phpstan-symfony.
      - name: Warmup cache (dev)
        run: php bin/console cache:warmup --env=dev

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: PHP-CS-Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Migrations Postgres (rejeu sur la vraie BDD)
        run: |
          php bin/console doctrine:database:create --env=test --if-not-exists
          php bin/console doctrine:migrations:migrate --no-interaction --env=test

      # Fixtures Alice en base de test : nécessaires aux tests cross-tenant (palier 2).
      - name: Charger les fixtures (test)
        run: php bin/console hautelook:fixtures:load --no-interaction --env=test

      - name: PHPUnit
        run: vendor/bin/phpunit

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shiftly-app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: shiftly-app/package-lock.json

      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Vitest
        run: npm run test
      - name: Build
        run: npm run build
